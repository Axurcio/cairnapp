[project]
name = "cairn"
version = "0.1.0"
description = "Cairn: a configurable platform for long-duration human-development and evidence-gathering journeys."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Smart Tech Ventures" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "temporalio>=1.8",
    "structlog>=24.1",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "minio>=7.2",
    "graphiti-core>=0.17",
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
# NeMo Guardrails is heavy (LangChain, annoy, fastembed). It is an opt-in
# defence-in-depth layer, so it is not installed by default.
nemo = ["nemoguardrails>=0.11"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cairn"]

[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/mobile", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = [
    "S101",   # assert is fine in tests and invariants
    "RUF012", # mutable class attrs are idiomatic in pydantic/sqlalchemy
    "B008",   # FastAPI Depends() in argument defaults is idiomatic
    "N818",   # exception names like NotFound/ConsentRequired read better without "Error"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311"]
"migrations/**" = ["E501"]
"scripts/**" = ["S311"]

[tool.ruff.lint.isort]
known-first-party = ["cairn"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["cairn"]
exclude = ["cairn/guardrails/nemo_config/"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["graphiti_core.*", "nemoguardrails.*", "minio.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires the Docker Compose services (postgres, neo4j, temporal, minio)",
]
filterwarnings = ["ignore::DeprecationWarning:graphiti_core.*"]

# Same-origin gateway for the Cairn website. TLS is terminated in front of this in
# production (set CAIRN_SESSION_COOKIE_SECURE=true on the API when it is).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Evidence uploads are capped at 25 MB by the API; leave room for multipart overhead.
    client_max_body_size 26m;

    include /etc/nginx/snippets/security-headers.conf;

    location /v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # Hashed build assets never change: cache them for a long time.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Client-side routes (/login, /journeys/...) all serve the app shell.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

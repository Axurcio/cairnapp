# Authoritative, deterministic safety rules for this pack (independent of NeMo).
safety_policy:
  id: parkinsons_sample_safety
  version: 1.0.0
  descriptive_only: true
  prohibited_next_actions: []
  prohibited_claims:
    - id: diagnosis_claim
      category: diagnosis
      patterns:
        - "\\byou (have|might have|may have|probably have|likely have)\\b.{0,30}\\bparkinson"
        - "\\bparkinsonian\\b"
        - "\\bconfirms?\\b.{0,30}\\bparkinson"
        - "\\bdiagnos(is|e|ed|ing)\\b"
    - id: treatment_recommendation
      category: treatment_recommendation
      patterns:
        - "\\byou should (take|start|stop|increase|decrease|reduce|change)\\b"
        - "\\b(medication|medicine|dose|dosage|levodopa|prescri\\w*)\\b"
        - "\\b\\d+\\s?mg\\b"
    - id: prognosis_claim
      category: prognosis
      patterns:
        - "\\bwill (get worse|progress|deteriorate)\\b"
  escalation_triggers:
    # SAMPLE signposting triggers; a real deployment defines these with clinicians.
    - id: fall_or_injury
      patterns: ["\\b(fell|fallen|fall) (over|down)\\b", "\\bhurt myself\\b", "\\binjur(ed|y)\\b"]
      guidance_id: contact_care_team
      reason: participant mentioned a fall or injury
    - id: acute_distress
      patterns: ["\\bchest pain\\b", "\\bcan'?t breathe\\b", "\\bemergency\\b", "\\bsuicid", "\\bkill myself\\b"]
      guidance_id: contact_care_team
      reason: participant mentioned possible acute distress
  escalation_template: "Thank you for telling me."
  human_review_required_categories: [clinical_guidance]
  safe_fallback_text: "Thank you for sharing that. I've made a note of it."
